name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  frontend:
    name: Frontend build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml

      - name: Install frontend deps
        run: pnpm install --frozen-lockfile

      - name: Build frontend
        run: pnpm build
        env:
          BACKEND_URL: http://localhost:8000
          NEXT_PUBLIC_SUPABASE_URL: https://placeholder.supabase.co
          NEXT_PUBLIC_SUPABASE_ANON_KEY: placeholder-anon-key
          NEXT_PUBLIC_DYNAMIC_ENVIRONMENT_ID: placeholder-env-id

  frontend_e2e:
    name: Frontend E2E (Playwright)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml

      - name: Install frontend deps
        run: pnpm install --frozen-lockfile

      - name: Install Playwright browsers
        run: pnpm e2e:install

      - name: Run Playwright E2E
        run: pnpm test:e2e:ci
        env:
          BACKEND_URL: http://localhost:8000
          NEXT_PUBLIC_SUPABASE_URL: https://placeholder.supabase.co
          NEXT_PUBLIC_SUPABASE_ANON_KEY: placeholder-anon-key
          NEXT_PUBLIC_DYNAMIC_ENVIRONMENT_ID: placeholder-env-id

      - name: Upload Playwright report (on failure)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: frontend/playwright-report

  backend:
    name: Backend tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: airdrop_works_test
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5

      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install backend dependencies
        run: uv sync --frozen --extra dev

      - name: Run migrations
        run: uv run python manage.py migrate --noinput
        env:
          DJANGO_ENV: local
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/airdrop_works_test
          REDIS_URL: redis://localhost:6379/0
          SECRET_KEY: ci-test-secret-key
          SPORE_QDRANT_ENABLED: "false"

      - name: Run Phase 2 backend test slice with coverage gate
        run: >-
          uv run pytest tests/test_judge_integration.py tests/test_quests_integration.py
          apps/quests/tests apps/judge/tests apps/integrity/tests
          apps/contributions/tests/test_tasks.py apps/contributions/tests/test_sentiment.py
          apps/accounts/tests/test_twitter_oauth.py
          apps/rewards/tests apps/ai_core/tests/test_service.py
          --cov=apps.quests --cov=apps.judge --cov=apps.integrity
          --cov-report=term-missing --cov-fail-under=20
        env:
          DJANGO_ENV: local
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/airdrop_works_test
          REDIS_URL: redis://localhost:6379/0
          SECRET_KEY: ci-test-secret-key
          SPORE_QDRANT_ENABLED: "false"
